
plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.github.spotbugs' version '6.5.11'
}

group = 'org.example'
version = '0.0.1-SNAPSHOT'
description = 'erp_back'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'io.github.cdimascio:java-dotenv:5.2.2'
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'

    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    implementation 'com.jcraft:jsch:0.1.55'
    implementation 'org.jsoup:jsoup:1.17.2'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    runtimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    implementation 'com.itextpdf:itext-core:9.4.0'

    implementation 'org.apache.poi:poi-ooxml:5.4.0'
    implementation 'org.apache.poi:poi:5.2.3'

    implementation 'org.springframework.security:spring-security-cas'

    testImplementation 'com.h2database:h2'

    compileOnly "com.github.spotbugs:spotbugs-annotations:4.10.4"
    testCompileOnly "com.github.spotbugs:spotbugs-annotations:4.10.4"
    spotbugsPlugins 'com.h3xstream.findsecbugs:findsecbugs-plugin:1.14.0'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('runPdfGenerator', JavaExec) {
    group = 'verification'
    mainClass = 'fr.iut_unilim.erp_back.PdfCreatorApplication'
    classpath = sourceSets.main.runtimeClasspath
}

spotbugs {
    toolVersion = '4.10.4'
}
